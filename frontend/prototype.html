<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineWays - CDMX Transit Sketch</title>
    <style>
        :root {
            --primary: #e91e63;
            --primary-dark: #c2185b;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333;
            --text-muted: #666;
            --border: #ddd;
            --metro-orange: #ff5722;
            --bike-green: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
        }

        #map-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, #e0e0e0 25%, #d5d5d5 25%, #d5d5d5 50%, #e0e0e0 50%, #e0e0e0 75%, #d5d5d5 75%, #d5d5d5 100%);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        #map-placeholder::after {
            content: "MAP VIEW (CDMX)";
            font-weight: bold;
            color: #999;
            letter-spacing: 2px;
        }

        .overlay {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            pointer-events: auto;
            max-width: 400px;
            width: 100%;
        }

        .search-panel {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .stop-point {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-add-stop {
            background: none;
            border: 2px dashed var(--border);
            color: var(--text-muted);
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .btn-add-stop:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            padding: 12px 5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 8px rgba(233, 30, 99, 0.3);
        }

        .mode-icon {
            font-size: 1.2rem;
        }

        .route-summary {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            margin-top: 10px;
        }

        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .time {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text);
        }

        .distance {
            color: var(--text-muted);
        }

        .itinerary {
            list-style: none;
        }

        .step {
            display: flex;
            gap: 15px;
            padding-bottom: 15px;
            position: relative;
        }

        .step::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 20px;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }

        .step:last-child::before {
            display: none;
        }

        .step-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--border);
            z-index: 2;
            margin-top: 5px;
        }

        .step-icon.walking { background: #9e9e9e; }
        .step-icon.metro { background: var(--metro-orange); }
        .step-icon.bike { background: var(--bike-green); }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .step-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 500px) {
            .overlay { padding: 10px; }
            .card { max-width: none; }
        }
    </style>
</head>
<body>

    <div id="map-placeholder"></div>

    <div class="overlay">
        <div class="card search-panel">
            <h1>EngineWays 🚇🚲</h1>
            
            <div class="input-group">
                <label>Origin</label>
                <input type="text" placeholder="Your current location" value="Current Location">
            </div>

            <div id="stops-container">
                <!-- Dynamic stops go here -->
            </div>

            <button class="btn-add-stop" onclick="addStop()">+ Add Stop Point</button>

            <div class="input-group">
                <label>Destination</label>
                <input type="text" placeholder="Where to?" value="Palacio de Bellas Artes">
            </div>

            <div class="mode-selector">
                <button class="mode-btn active">
                    <span class="mode-icon">🚶🚇</span>
                    <span>Metro</span>
                </button>
                <button class="mode-btn">
                    <span class="mode-icon">🚶</span>
                    <span>Walk</span>
                </button>
                <button class="mode-btn">
                    <span class="mode-icon">🚲</span>
                    <span>Bike</span>
                </button>
            </div>

            <div class="route-summary">
                <div class="summary-header">
                    <span class="time">35 min</span>
                    <span class="distance">4.2 km</span>
                </div>
                
                <ul class="itinerary">
                    <li class="step">
                        <div class="step-icon walking"></div>
                        <div class="step-content">
                            <div class="step-title">Walk 5 min</div>
                            <div class="step-desc">To Metro Insurgentes</div>
                        </div>
                    </li>
                    <li class="step">
                        <div class="step-icon metro"></div>
                        <div class="step-content">
                            <div class="step-title">Metro Line 1</div>
                            <div class="step-desc">Direction Pantitlán • 4 stops</div>
                        </div>
                    </li>
                    <li class="step">
                        <div class="step-icon walking"></div>
                        <div class="step-content">
                            <div class="step-title">Walk 8 min</div>
                            <div class="step-desc">Arrive at Palacio de Bellas Artes</div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        function addStop() {
            const container = document.getElementById('stops-container');
            const stopDiv = document.createElement('div');
            stopDiv.className = 'input-group stop-point';
            stopDiv.innerHTML = `
                <div style="flex: 1">
                    <label>Stop Point</label>
                    <input type="text" placeholder="Stop location...">
                </div>
                <button onclick="this.parentElement.remove()" style="background:none; border:none; color: #f44336; cursor:pointer; font-size: 1.2rem; margin-top: 20px;">×</button>
            `;
            container.appendChild(stopDiv);
        }
    </script>
</body>
</html>
